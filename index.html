<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>투자일지</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-brand.css">
    <script>(function(){var t=localStorage.getItem("stocklio-theme");if(t){document.documentElement.dataset.theme=t;}else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){document.documentElement.dataset.theme="dark";}
// 부팅 가림막 안전장치 — JS 초기화가 실패해도 6초 뒤에는 화면을 연다.
setTimeout(function(){if(document.body){document.body.classList.remove("is-booting");}},6000);})();</script>
  </head>
  <body class="is-booting">
    <!-- 부팅 가림막 — 정적 마크업이 덜 그려진 채 노출되는 깜빡임을 막는다.
         첫 상태 발행(render)이 body.is-booting 을 제거하면 사라진다. -->
    <div id="bootVeil" aria-hidden="true">
      <div class="boot-veil-lockup">
        <img src="assets/tuja-ilji-icon-192.png" alt="">
        <span>투자일지</span>
      </div>
    </div>
    <div class="app-shell">
      <!-- 사이드바는 React(src/react/App.jsx → Sidebar)가 이 자리에 렌더한다.
           display:contents 로 <aside class="sidebar"> 가 .app-shell 그리드의 직접 자식(col 1)이 되게 한다. -->
      <div id="appShellSidebar" style="display: contents"></div>

      <main class="content">
      <!-- .content 상단 chrome(툴바/배너/토스트/로그인·이메일 다이얼로그)은 React(ContentChrome)가 렌더한다.
           display:contents 로 .toolbar 의 sticky 컨텍스트가 .content 기준으로 유지된다. -->
      <div id="contentChromeMount" style="display: contents"></div>

      <section id="emptyPortfolioNotice" class="empty-portfolio" data-view="dashboard" hidden>
        <div>
          <strong>포트폴리오를 시작하세요</strong>
          <span>계좌를 만들고 보유 종목이나 예수금을 입력하면 대시보드와 성과가 자동으로 채워집니다.</span>
        </div>
      </section>

      <section class="dashboard-status-strip" data-view="dashboard" aria-label="대시보드 상태">
        <div class="status-actions">
          <span id="layoutStatus" class="layout-status-badge" hidden></span>
          <button id="layoutResetButton" class="ghost small-button" type="button" hidden>기본값 복원</button>
          <button id="layoutEditButton" class="ghost small-button" type="button">편집</button>
          <button id="dashboardRefreshButton" class="ghost small-button" type="button">시세 확인</button>
          <button id="dashboardAddHoldingButton" class="primary small-button" type="button">종목 추가</button>
        </div>
      </section>

      <section id="dashboardBoard" class="dashboard-board" data-view="dashboard" aria-label="포트폴리오 대시보드">
        <!-- 대시보드 카드는 craft-dashboard(React)가 이 자리에 렌더한다. 부트 중에는 boot veil 이 가린다. -->
      </section>

      <!-- 계좌 탭은 React(AccountsView)가 렌더한다. data-view 로 legacy setView 가 표시를 토글한다. -->
      <div id="accountsViewMount" data-view="accounts" hidden></div>

      <!-- 보유 종목 탭은 React(HoldingsView)가 렌더한다. -->
      <div id="holdingsViewMount" data-view="holdings" hidden></div>

      <!-- 성과 탭은 React(PerformanceView)가 렌더한다. -->
      <div id="performanceViewMount" data-view="performance" hidden></div>

      <!-- 입출금 탭은 React(CashflowsView)가 렌더한다. -->
      <div id="cashflowsViewMount" data-view="cashflows" hidden></div>

      <!-- 설정(자동화) 탭은 React(AutomationView)가 렌더한다. -->
      <div id="automationViewMount" data-view="automation" hidden></div>

      <!-- 시뮬레이터 탭은 React(SimulatorView)가 렌더한다. -->
      <div id="simulatorViewMount" data-view="simulator" hidden></div>
    </main>
    </div>

    <script src="/assets/chart.umd.min.js"></script>
    <script src="/assets/chartjs-plugin-datalabels.min.js"></script>
    <script type="module" src="/src/react/main.jsx"></script>
  </body>
</html>
